[project]
name = "corpus-sieve"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "langdetect>=1.0.9",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
